{{- if not .Values.existingSecret }}
# Chart-managed Secret.  For production deployments, pre-create a Secret with
# all required keys and reference it via .Values.existingSecret.  Never commit
# plaintext secrets to version control.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "oneplatform.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oneplatform.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtPrivateKey: {{ .Values.secrets.jwtPrivateKey | quote }}
  jwtPublicKey: {{ .Values.secrets.jwtPublicKey | quote }}
  masterKey: {{ .Values.secrets.masterKey | quote }}
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  cursorSecret: {{ .Values.secrets.cursorSecret | quote }}
  postgresPassword: {{ .Values.secrets.postgresPassword | quote }}
  appDbPassword: {{ .Values.secrets.appDbPassword | quote }}
  redisPassword: {{ .Values.secrets.redisPassword | quote }}
  minioRootUser: {{ .Values.secrets.minioRootUser | quote }}
  minioRootPassword: {{ .Values.secrets.minioRootPassword | quote }}
  smtpHost: {{ .Values.secrets.smtpHost | quote }}
  smtpPort: {{ .Values.secrets.smtpPort | quote }}
  smtpUser: {{ .Values.secrets.smtpUser | quote }}
  smtpPassword: {{ .Values.secrets.smtpPassword | quote }}
  smtpFrom: {{ .Values.secrets.smtpFrom | quote }}
  smtpSecure: {{ .Values.secrets.smtpSecure | quote }}
{{- end }}
