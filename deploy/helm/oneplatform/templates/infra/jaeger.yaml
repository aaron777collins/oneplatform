{{- if .Values.jaeger.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-jaeger" (include "oneplatform.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oneplatform.serviceLabels" (dict "service" "jaeger" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "oneplatform.serviceSelectorLabels" (dict "service" "jaeger" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oneplatform.serviceLabels" (dict "service" "jaeger" "root" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "oneplatform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: jaeger
          image: {{ printf "%s:%s" .Values.jaeger.image.repository .Values.jaeger.image.tag | quote }}
          imagePullPolicy: {{ .Values.jaeger.image.pullPolicy }}
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: query-ui
              containerPort: 16686
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-jaeger" (include "oneplatform.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oneplatform.serviceLabels" (dict "service" "jaeger" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "oneplatform.serviceSelectorLabels" (dict "service" "jaeger" "root" .) | nindent 4 }}
  ports:
    - name: otlp-http
      port: {{ .Values.jaeger.service.otlpPort }}
      targetPort: otlp-http
    - name: query-ui
      port: {{ .Values.jaeger.service.queryPort }}
      targetPort: query-ui
{{- end }}
