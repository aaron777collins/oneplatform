{{/*
Pipeline Service — DAG traversal, transformation, expression evaluation.
Bottleneck: CPU.  BullMQ distributes pipeline run jobs across replicas.
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-pipeline" (include "oneplatform.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oneplatform.serviceLabels" (dict "service" "pipeline" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.pipeline.replicaCount }}
  selector:
    matchLabels:
      {{- include "oneplatform.serviceSelectorLabels" (dict "service" "pipeline" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oneplatform.serviceLabels" (dict "service" "pipeline" "root" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "oneplatform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "oneplatform.podScheduling" (dict "service" "pipeline" "root" .) | nindent 6 }}
      containers:
        - name: pipeline
          image: {{ include "oneplatform.image" (dict "svc" .Values.pipeline "root" .) | quote }}
          imagePullPolicy: {{ .Values.pipeline.image.pullPolicy | default .Values.image.pullPolicy }}
          env:
            {{- include "oneplatform.commonEnv" . | nindent 12 }}
            - name: SERVICE_NAME
              value: "pipeline-service"
            {{- range $k, $v := .Values.pipeline.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.pipeline.service.port }}
              protocol: TCP
          {{- include "oneplatform.startupProbe" . | nindent 10 }}
          {{- include "oneplatform.livenessProbe" . | nindent 10 }}
          {{- include "oneplatform.readinessProbe" . | nindent 10 }}
          resources:
            {{- toYaml .Values.pipeline.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-pipeline" (include "oneplatform.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oneplatform.serviceLabels" (dict "service" "pipeline" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "oneplatform.serviceSelectorLabels" (dict "service" "pipeline" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.pipeline.service.port }}
      targetPort: http
---
{{ include "oneplatform.hpa" (dict "service" "pipeline" "cfg" .Values.pipeline "root" .) }}
