# Production nginx configuration for OnePlatform frontend.
#
# Responsibilities:
#   - Serve the React SPA with a SPA fallback (try_files → /index.html)
#   - Cache immutable hashed assets aggressively; never cache index.html
#   - Block source-map leakage in production
#   - Enable gzip for text assets
#
# Note: /api/* routing and TLS termination are handled by Caddy at the edge.
# Security headers (HSTS, CSP, X-Frame-Options, etc.) are set by Caddy.
# This nginx instance only serves static files internally.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Gzip compression — saves bandwidth for JS/CSS/JSON
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;

        # ---------------------------------------------------------------------------
        # Block source-map exposure in production
        # Source maps contain original TypeScript source and should never be served.
        # ---------------------------------------------------------------------------
        location ~* \.map$ {
            return 404;
        }

        # ---------------------------------------------------------------------------
        # Immutable hashed static assets — Vite writes /assets/*.js and /assets/*.css
        # with content hashes in the filename, so they can be cached indefinitely.
        # ---------------------------------------------------------------------------
        location /assets/ {
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
            # Inherit security headers defined at the server block level
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ---------------------------------------------------------------------------
        # theme-init.js — served from /public, not hashed.
        # Use a short max-age so changes are picked up quickly.
        # ---------------------------------------------------------------------------
        location = /theme-init.js {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ---------------------------------------------------------------------------
        # SPA fallback — any path that doesn't match a file on disk is served
        # index.html so React Router handles client-side navigation.
        # index.html itself must not be cached so deploys are picked up immediately.
        # ---------------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
