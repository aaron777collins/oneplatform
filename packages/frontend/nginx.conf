# Production nginx configuration for OnePlatform frontend.
#
# Responsibilities:
#   - Serve the React SPA with a SPA fallback (try_files → /index.html)
#   - Proxy /api/* to the Gateway service
#   - Set strict Content-Security-Policy headers
#   - Cache immutable hashed assets aggressively; never cache index.html
#   - Block source-map leakage in production
#   - Enable gzip for text assets

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Gzip compression — saves bandwidth for JS/CSS/JSON
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------------
        add_header X-Content-Type-Options    "nosniff"       always;
        add_header X-Frame-Options           "DENY"          always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        # Content-Security-Policy:
        #   script-src 'self'          — allows /theme-init.js and the Vite bundle;
        #                                no 'unsafe-inline' needed (no inline scripts).
        #   style-src  'self' 'unsafe-inline' — Tailwind injects styles at runtime
        #                                       via <style> tags; required for CSS-in-JS.
        #   connect-src 'self'         — fetch/XHR only to same origin (proxied via /api).
        #   img-src 'self' data: blob: — avatars may arrive as data URIs or blob URLs.
        #   font-src 'self'            — no external font CDNs.
        #   object-src 'none'          — disallow <object>/<embed>.
        #   base-uri 'self'            — prevent base-tag injection.
        #   frame-ancestors 'none'     — equivalent to X-Frame-Options DENY but for CSP.
        add_header Content-Security-Policy
            "default-src 'none'; \
             script-src 'self'; \
             style-src 'self' 'unsafe-inline'; \
             connect-src 'self'; \
             img-src 'self' data: blob:; \
             font-src 'self'; \
             object-src 'none'; \
             base-uri 'self'; \
             frame-ancestors 'none';"
            always;

        # ---------------------------------------------------------------------------
        # Block source-map exposure in production
        # Source maps contain original TypeScript source and should never be served.
        # ---------------------------------------------------------------------------
        location ~* \.map$ {
            return 404;
        }

        # ---------------------------------------------------------------------------
        # API proxy — forward all /api/* requests to the Gateway service.
        # The Gateway strips the /api prefix via its own routing config.
        # ---------------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://gateway:3000/;
            proxy_http_version 1.1;

            # Required for SSE (Server-Sent Events) — disable buffering so
            # log-stream events reach the browser immediately.
            proxy_buffering    off;
            proxy_cache        off;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Pass the session cookie through unchanged
            proxy_pass_header  Set-Cookie;
        }

        # ---------------------------------------------------------------------------
        # Immutable hashed static assets — Vite writes /assets/*.js and /assets/*.css
        # with content hashes in the filename, so they can be cached indefinitely.
        # ---------------------------------------------------------------------------
        location /assets/ {
            expires max;
            add_header Cache-Control "public, max-age=31536000, immutable";
            # Inherit security headers defined at the server block level
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ---------------------------------------------------------------------------
        # theme-init.js — served from /public, not hashed.
        # Use a short max-age so changes are picked up quickly.
        # ---------------------------------------------------------------------------
        location = /theme-init.js {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ---------------------------------------------------------------------------
        # SPA fallback — any path that doesn't match a file on disk is served
        # index.html so React Router handles client-side navigation.
        # index.html itself must not be cached so deploys are picked up immediately.
        # ---------------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
