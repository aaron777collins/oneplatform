<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnePlatform</title>
    <!--
      Theme detection runs before React hydrates to prevent a flash of the wrong
      theme. The hash of this exact script must be added to the CSP header in
      nginx.conf when CSP is enforced in production.
    -->
    <script>
      (function () {
        var theme = localStorage.getItem("op-theme");
        if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
