<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnePlatform</title>

    <!-- PWA / mobile web app metadata -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OnePlatform" />

    <!--
      Theme detection runs before React hydrates to prevent a flash of the wrong
      theme. Extracted to an external file so no inline-script CSP hash is needed
      in nginx.conf — 'script-src self' covers it automatically.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
