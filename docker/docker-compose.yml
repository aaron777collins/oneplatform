# OnePlatform Docker Compose Stack
# Ref: L1 Design Spec §2 "Docker Compose Stack"
#
# Startup order:
#   Layer 0: op-init (one-shot, generates all secrets and Ed25519 key pairs)
#   Layer 1: postgres, redis, minio, docker-socket-proxy
#   Layer 2: pgbouncer (connection pooler)
#   Layer 3: application services (gateway, auth, ingestion, ontology, pipeline,
#            execution, app, logging, plugin)
#   Layer 4: frontend (nginx serving the React SPA, proxying /api/* to gateway)
#
# Secret injection pattern:
#   - Secrets generated by op-init live on the init-data volume at /data/init/
#   - Each service mounts init-data read-only and reads OP_* values from files
#     using shell command substitution in its entrypoint (see service-entrypoint.sh)
#   - Public Ed25519 keys live on shared-pubkeys at /data/service-keys/ (read-only)
#   - Private Ed25519 keys live on init-data at /data/init/keys/<service>/private.pem

x-service-common: &service-common
  # All application services share this base configuration.
  # Override per-service values in the individual service definition.
  build:
    context: ..
    dockerfile: docker/Dockerfile.service
  restart: unless-stopped
  networks:
    - oneplatform-internal
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # ─── Layer 0: Init ────────────────────────────────────────────────────────
  op-init:
    image: alpine:3.19
    volumes:
      - init-data:/data/init
      - shared-pubkeys:/data/service-keys
      - ./init/init.sh:/init.sh:ro
    command: ["/bin/sh", "/init.sh"]
    networks: []
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-f", "/data/init/ready"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ─── Layer 1: Data Stores ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      # Superuser password — generated by op-init.
      # Requires: docker compose run --rm op-init before first `docker compose up`
      # OR: set POSTGRES_PASSWORD in .env for first-time bootstrap.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_superuser}
      POSTGRES_DB: oneplatform
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - init-data:/data/init:ro
      # init.sql creates roles with CHANGE_ME placeholders
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # set-passwords.sh runs after init.sql and applies op-init passwords
      - ./postgres/set-passwords.sh:/docker-entrypoint-initdb.d/02-set-passwords.sh:ro
    networks:
      - oneplatform-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oneplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      op-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"

  redis:
    image: redis:7-alpine
    # The custom entrypoint renders users.acl from the template using op-init passwords.
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    volumes:
      - redis-data:/data
      - init-data:/data/init:ro
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./redis/users.acl.template:/etc/redis/users.acl.template:ro
      - ./redis/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    networks:
      - oneplatform-internal
    healthcheck:
      # Read the rendered admin password from the init volume to authenticate.
      test:
        - "CMD-SHELL"
        - |
          PASS=$(cat /data/init/redis_password_admin.txt | tr -d '[:space:]') &&
          redis-cli --user op_admin -a "$$PASS" ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      op-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OP_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OP_MINIO_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - oneplatform-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    depends_on:
      op-init:
        condition: service_healthy
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    environment:
      # CONTAINERS=1 allows the execution service to list and inspect containers.
      CONTAINERS: 1
      # POST=0 and DELETE=0: deny container creation and deletion via the proxy.
      # Allowing POST would permit arbitrary container creation with volume mounts,
      # which could be used to escape the sandbox or access host filesystem paths.
      # The execution service manages sandboxes via pre-built images launched at
      # service startup — it does not need to create containers at runtime.
      POST: 0
      DELETE: 0
      LOG: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - oneplatform-sandbox
    restart: unless-stopped
    depends_on:
      op-init:
        condition: service_healthy

  # ─── Layer 2: Connection Pooler ───────────────────────────────────────────
  pgbouncer:
    image: pgbouncer/pgbouncer:1.22.1
    # Custom entrypoint renders userlist.txt from template using op-init passwords.
    entrypoint: ["/bin/sh", "/usr/local/bin/pgbouncer-entrypoint.sh"]
    volumes:
      - init-data:/data/init:ro
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt.template:/etc/pgbouncer/userlist.txt.template:ro
      - ./pgbouncer/pgbouncer-entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    networks:
      - oneplatform-internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ─── Layer 3: Application Services ───────────────────────────────────────
  #
  # Secret injection: each service container mounts init-data read-only.
  # The service-entrypoint.sh wrapper reads secret files and exports them as
  # environment variables before exec'ing `node dist/index.js`.
  #
  # Per-service database connections route through PgBouncer on port 5433.
  # The DATABASE_ALIAS env var controls which PgBouncer database alias is used
  # (matching pgbouncer.ini [databases] section, e.g. oneplatform_auth).
  #
  # Ed25519 private keys: each service mounts its own private key from init-data.
  # Public keys: all services mount the shared-pubkeys volume at /data/service-keys.

  gateway-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: gateway
    container_name: gateway-service
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      SERVICE_NAME: gateway-service
      NODE_ENV: production
      PORT: "3000"
      # Service-to-service URLs — use docker-compose service names and internal port 3000.
      # Each service listens on port 3000 inside its container; host port differs per service.
      ONTOLOGY_SERVICE_URL: http://ontology-service:3000
      INGESTION_SERVICE_URL: http://ingestion-service:3000
      # OP_* values injected by service-entrypoint.sh from init-data volume
      OP_BASE_URL: ${OP_BASE_URL:-http://localhost:3000}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-http://localhost:3000}
      OP_GLOBAL_RATE_LIMIT: ${OP_GLOBAL_RATE_LIMIT:-10000}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD}
      OP_WEBHOOK_ALLOW_HTTP: ${OP_WEBHOOK_ALLOW_HTTP:-false}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    ports:
      - "3000:3000"
    networks:
      - oneplatform-internal
      - oneplatform-public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  auth-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: auth
    container_name: auth-service
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      SERVICE_NAME: auth-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-http://localhost:3000}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-http://localhost:3000}
      OP_REQUIRE_EMAIL_VERIFICATION: ${OP_REQUIRE_EMAIL_VERIFICATION:-false}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD}
      OP_SMTP_HOST: ${OP_SMTP_HOST:-}
      OP_SMTP_PORT: ${OP_SMTP_PORT:-}
      OP_SMTP_USER: ${OP_SMTP_USER:-}
      OP_SMTP_PASS: ${OP_SMTP_PASS:-}
      OP_SMTP_FROM: ${OP_SMTP_FROM:-}
      OP_SMTP_SECURE: ${OP_SMTP_SECURE:-true}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  ingestion-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ingestion
    container_name: ingestion-service
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      SERVICE_NAME: ingestion-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-http://localhost:3000}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-http://localhost:3000}
      OP_INGESTION_BATCH_SIZE: ${OP_INGESTION_BATCH_SIZE:-1000}
      OP_LARGE_SYNC_CONCURRENCY: ${OP_LARGE_SYNC_CONCURRENCY:-3}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    ports:
      - "3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  ontology-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ontology
    container_name: ontology-service
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      SERVICE_NAME: ontology-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-http://localhost:3000}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-http://localhost:3000}
      OP_MIGRATION_TIMEOUT: ${OP_MIGRATION_TIMEOUT:-3600}
      OP_ONTOLOGY_POLL_INTERVAL: ${OP_ONTOLOGY_POLL_INTERVAL:-15}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    ports:
      - "3003:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  pipeline-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: pipeline
    container_name: pipeline-service
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      SERVICE_NAME: pipeline-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-http://localhost:3000}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-http://localhost:3000}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    ports:
      - "3004:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  execution-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: execution
    container_name: execution-service
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      SERVICE_NAME: execution-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-http://localhost:3000}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-http://localhost:3000}
      OP_SANDBOX_POOL_SIZE: ${OP_SANDBOX_POOL_SIZE:-5}
      OP_CONNECTOR_TIMEOUT_SECONDS: ${OP_CONNECTOR_TIMEOUT_SECONDS:-300}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD}
      # Execution service connects to docker-socket-proxy for sandbox management
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
      - sandbox-socket:/var/run/sandbox
    networks:
      - oneplatform-internal
      - oneplatform-sandbox
    ports:
      - "3005:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"

  app-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: app
    container_name: app-service
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      SERVICE_NAME: app-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-http://localhost:3000}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-http://localhost:3000}
      OP_WILDCARD_DOMAIN: ${OP_WILDCARD_DOMAIN:-}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - app-data:/data/app
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    ports:
      - "3006:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  logging-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: logging
    container_name: logging-service
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      SERVICE_NAME: logging-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-http://localhost:3000}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-http://localhost:3000}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    ports:
      - "3007:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  plugin-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: plugin
    container_name: plugin-service
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      SERVICE_NAME: plugin-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-http://localhost:3000}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-http://localhost:3000}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - plugin-data:/data/plugin
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    ports:
      - "3008:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ─── Layer 4: Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: frontend
    environment:
      # VITE_API_URL is baked into the SPA at build time (not a runtime env var).
      # See Dockerfile.frontend where it is passed as a build arg.
      NGINX_GATEWAY_URL: http://gateway-service:3000
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - oneplatform-internal
      - oneplatform-public
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  init-data:
  gateway-data:
  auth-data:
  ingestion-data:
  ontology-data:
  pipeline-data:
  execution-data:
  app-data:
  logging-data:
  plugin-data:
  sandbox-socket:
  shared-pubkeys:

networks:
  oneplatform-public:
    driver: bridge
  oneplatform-internal:
    driver: bridge
    internal: true
  oneplatform-sandbox:
    driver: bridge
    internal: true
