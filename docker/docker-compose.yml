# OnePlatform Docker Compose Stack
# Ref: L1 Design Spec §2 "Docker Compose Stack"
#
# Startup order:
#   Layer 0: op-init (one-shot, generates all secrets and Ed25519 key pairs)
#   Layer 1: postgres, redis, minio, docker-socket-proxy
#   Layer 2: pgbouncer (connection pooler)
#   Layer 3: application services (gateway, auth, ingestion, ontology, pipeline,
#            execution, app, logging, plugin)
#   Layer 4: frontend (nginx serving the React SPA, proxying /api/* to gateway)
#
# Secret injection pattern:
#   - Secrets generated by op-init live on the init-data volume at /data/init/
#   - Each service mounts init-data read-only and reads OP_* values from files
#     using shell command substitution in its entrypoint (see service-entrypoint.sh)
#   - Public Ed25519 keys live on shared-pubkeys at /data/service-keys/ (read-only)
#   - Private Ed25519 keys live on init-data at /data/init/keys/<service>/private.pem

# Shared OTEL environment variable injected into every service environment block.
# Using a YAML anchor because YAML merge (<<:) does not deep-merge maps; adding
# environment to x-service-common would be silently overridden by each service's
# own environment block. The anchor is referenced explicitly in each service.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}

x-service-common: &service-common
  # All application services share this base configuration.
  # Override per-service values in the individual service definition.
  build:
    context: ..
    dockerfile: docker/Dockerfile.service
  restart: unless-stopped
  stop_grace_period: 45s
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"
  networks:
    - oneplatform-internal
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
  # Container hardening: prevent privilege escalation, drop all Linux capabilities,
  # and mount the root filesystem read-only. Services write only to explicitly
  # declared volumes (e.g. app-data, plugin-data) and /tmp via tmpfs.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=100M

services:

  # ─── Layer 0: Init ────────────────────────────────────────────────────────
  op-init:
    image: alpine:3.19
    volumes:
      - init-data:/data/init
      - shared-pubkeys:/data/service-keys
      - ./init/init.sh:/init.sh:ro
    command: ["/bin/sh", "/init.sh"]
    networks: []
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-f", "/data/init/ready"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ─── Layer 1: Data Stores ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      # Superuser password — only used during first-time PostgreSQL initialisation.
      # IMPORTANT: set-passwords.sh runs at first boot and replaces this with the
      # op-init generated password from db_password_postgres_superuser.txt, so the
      # dev default is only active for the brief window during `docker-entrypoint-initdb.d`
      # execution on a fresh volume. For production, use docker-compose.prod.yml which
      # enforces a strong POSTGRES_PASSWORD via :? syntax.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_superuser}
      POSTGRES_DB: oneplatform
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - init-data:/data/init:ro
      # init.sql creates roles with CHANGE_ME placeholders
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # set-passwords.sh runs after init.sql and applies op-init passwords
      - ./postgres/set-passwords.sh:/docker-entrypoint-initdb.d/02-set-passwords.sh:ro
    networks:
      - oneplatform-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oneplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      op-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"

  redis:
    image: redis:7-alpine
    # The custom entrypoint renders users.acl from the template using op-init passwords.
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    volumes:
      - redis-data:/data
      - init-data:/data/init:ro
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./redis/users.acl.template:/etc/redis/users.acl.template:ro
      - ./redis/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    networks:
      - oneplatform-internal
    healthcheck:
      # Read the rendered admin password from the init volume to authenticate.
      test:
        - "CMD-SHELL"
        - |
          PASS=$(cat /data/init/redis_password_admin.txt | tr -d '[:space:]') &&
          redis-cli --user op_admin -a "$$PASS" ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      op-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OP_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
    volumes:
      - minio-data:/data
    networks:
      - oneplatform-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    depends_on:
      op-init:
        condition: service_completed_successfully
    restart: unless-stopped

  docker-socket-proxy:
    # SA-010: Security boundary documentation for the Docker socket proxy.
    #
    # THREAT MODEL
    # ------------
    # Exposing the raw Docker socket (/var/run/docker.sock) to any container
    # grants that container root-equivalent access to the host — it can create
    # privileged containers, mount host paths, and escape isolation entirely.
    # This proxy interposes on the Docker API and allows only the specific HTTP
    # verbs and resource types that the execution service genuinely needs.
    #
    # WHAT THE EXECUTION SERVICE NEEDS
    # ----------------------------------
    # The execution service creates ephemeral sandbox containers for each
    # plugin/user code execution, starts them, waits for completion, reads
    # their exit codes, and then deletes them. It also pulls sandbox images
    # on first use. These are the minimal required operations:
    #
    #   GET  /containers/*   — inspect, list (to verify sandbox labels)
    #   POST /containers/*   — create (docker create) and start (docker start)
    #   DELETE /containers/* — remove after execution or on timeout
    #   GET  /images/*       — list available sandbox images
    #   POST /images/*       — pull (docker pull) when image is absent
    #
    # WHAT IS NOT PERMITTED (not enabled)
    # -------------------------------------
    # NETWORKS, VOLUMES, SERVICES, TASKS, SWARM, SECRETS, CONFIGS, NODES,
    # DISTRIBUTION, PLUGINS — all disabled (default=0 in docker-socket-proxy).
    # This prevents the execution service from modifying the stack's networking,
    # creating persistent volumes, or reading secrets from Swarm.
    #
    # RESIDUAL RISK
    # -------------
    # tecnativa/docker-socket-proxy 0.2.0 enforces resource-level ACLs
    # (CONTAINERS, IMAGES) but not per-path ACLs within a resource. An
    # attacker who compromises the execution service container could use
    # POST /containers/create to create a *new* container with arbitrary
    # HostConfig (e.g. mounting the host root filesystem). Mitigations:
    #   (a) The execution service runs on the isolated oneplatform-sandbox
    #       network, not reachable from public or internal app networks.
    #   (b) All sandbox containers are created with no-new-privileges,
    #       cap_drop: ALL, read_only, and resource limits via HostConfig,
    #       making lateral movement from within a sandbox harder.
    #   (c) The execution service verifies container labels before any
    #       DELETE call and tracks created container IDs in memory.
    #   (d) Future proxy versions with path-level ACLs should be evaluated
    #       to restrict create/start/delete to labelled sandbox containers only.
    #
    # DISABLING CONTAINER CREATION IS NOT SUPPORTED
    # -----------------------------------------------
    # CONTAINERS_CREATE=0 / CONTAINERS_DELETE=0 are not valid environment
    # variables for tecnativa/docker-socket-proxy. The proxy only supports
    # resource-level enable/disable (CONTAINERS=0|1), not per-verb sub-controls.
    # Upgrading to a proxy that supports per-verb or per-label ACLs (e.g.
    # docker-socket-proxy with path regex) is the correct long-term fix.
    image: tecnativa/docker-socket-proxy:0.2.0
    environment:
      # CONTAINERS=1 allows the execution service to list, inspect, and create
      # sandbox containers via the Docker API.
      CONTAINERS: 1
      # IMAGES=1 allows the execution service to list and pull sandbox images.
      IMAGES: 1
      # POST=1: required for container creation (docker create / docker start).
      # The execution service creates ephemeral sandbox containers at runtime.
      # SECURITY NOTE: POST + CONTAINERS allows creating arbitrary containers.
      # This is mitigated by:
      #   (a) the execution service running on the oneplatform-sandbox network only,
      #   (b) container hardening (no-new-privileges, cap_drop: ALL, read_only) applied
      #       to all created sandbox containers via HostConfig,
      #   (c) tecnativa/docker-socket-proxy 0.2.0 does not support per-path ACLs —
      #       future upgrades should evaluate path-based filtering when available.
      POST: 1
      # DELETE=1: the execution service issues DELETE calls to clean up sandbox
      # containers after execution completes, and to force-remove timed-out
      # containers. AutoRemove is also set in HostConfig as a safety net.
      # SECURITY NOTE: DELETE + CONTAINERS allows removing any container, not only
      # sandboxes. The execution service restricts DELETE calls to containers it
      # created by tracking their IDs in memory and verifying labels before deletion.
      DELETE: 1
      LOG: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - oneplatform-sandbox
    restart: unless-stopped
    depends_on:
      op-init:
        condition: service_completed_successfully

  # ─── Layer 2: Connection Pooler ───────────────────────────────────────────
  pgbouncer:
    image: pgbouncer/pgbouncer:1.22.1
    # Custom entrypoint renders userlist.txt from template using op-init passwords.
    entrypoint: ["/bin/sh", "/usr/local/bin/pgbouncer-entrypoint.sh"]
    volumes:
      - init-data:/data/init:ro
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt.template:/etc/pgbouncer/userlist.txt.template:ro
      - ./pgbouncer/pgbouncer-entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    networks:
      - oneplatform-internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # pg_isready only checks if the port accepts TCP connections — it does not
      # authenticate or verify that PgBouncer can reach the upstream PostgreSQL.
      # Use psql to run a lightweight authenticated query through PgBouncer so
      # the healthcheck fails if PgBouncer cannot proxy connections to Postgres.
      test:
        - "CMD-SHELL"
        - |
          PASS=$(cat /data/init/db_password_app.txt 2>/dev/null | tr -d '[:space:]') &&
          PGPASSWORD="$$PASS" psql -h localhost -p 5433 -U app_service_role -d oneplatform_app -c 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ─── Layer 3: Application Services ───────────────────────────────────────
  #
  # Secret injection: each service container mounts init-data read-only.
  # The service-entrypoint.sh wrapper reads secret files and exports them as
  # environment variables before exec'ing `node dist/index.js`.
  #
  # Per-service database connections route through PgBouncer on port 5433.
  # The DATABASE_ALIAS env var controls which PgBouncer database alias is used
  # (matching pgbouncer.ini [databases] section, e.g. oneplatform_auth).
  #
  # Ed25519 private keys: each service mounts its own private key from init-data.
  # Public keys: all services mount the shared-pubkeys volume at /data/service-keys.

  gateway-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: gateway
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: gateway-service
      NODE_ENV: production
      PORT: "3000"
      # Service-to-service URLs — use docker-compose service names and internal port 3000.
      # Each service listens on port 3000 inside its container; host port differs per service.
      ONTOLOGY_SERVICE_URL: http://ontology-service:3000
      INGESTION_SERVICE_URL: http://ingestion-service:3000
      AUTH_SERVICE_URL: http://auth-service:3000
      PIPELINE_SERVICE_URL: http://pipeline-service:3000
      EXECUTION_SERVICE_URL: http://execution-service:3000
      APP_SERVICE_URL: http://app-service:3000
      LOGGING_SERVICE_URL: http://logging-service:3000
      PLUGIN_SERVICE_URL: http://plugin-service:3000
      # OP_* values injected by service-entrypoint.sh from init-data volume
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost}
      OP_GLOBAL_RATE_LIMIT: ${OP_GLOBAL_RATE_LIMIT:-10000}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
      OP_WEBHOOK_ALLOW_HTTP: ${OP_WEBHOOK_ALLOW_HTTP:-false}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    networks:
      - oneplatform-internal
      - oneplatform-public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  auth-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: auth
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: auth-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost}
      OP_REQUIRE_EMAIL_VERIFICATION: ${OP_REQUIRE_EMAIL_VERIFICATION:-false}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
      OP_SMTP_HOST: ${OP_SMTP_HOST:-}
      OP_SMTP_PORT: ${OP_SMTP_PORT:-}
      OP_SMTP_USER: ${OP_SMTP_USER:-}
      OP_SMTP_PASS: ${OP_SMTP_PASS:-}
      OP_SMTP_FROM: ${OP_SMTP_FROM:-}
      OP_SMTP_SECURE: ${OP_SMTP_SECURE:-true}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    # Debug: uncomment to expose service directly (127.0.0.1 only — never 0.0.0.0)
    # Internal services reach auth-service via the oneplatform-internal Docker
    # network using the service name. No host binding is needed at runtime.
    # ports:
    #   - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  ingestion-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ingestion
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: ingestion-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost}
      OP_INGESTION_BATCH_SIZE: ${OP_INGESTION_BATCH_SIZE:-1000}
      OP_LARGE_SYNC_CONCURRENCY: ${OP_LARGE_SYNC_CONCURRENCY:-3}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    # Debug: uncomment to expose service directly (127.0.0.1 only — never 0.0.0.0)
    # ports:
    #   - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  ontology-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ontology
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: ontology-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost}
      OP_MIGRATION_TIMEOUT: ${OP_MIGRATION_TIMEOUT:-3600}
      OP_ONTOLOGY_POLL_INTERVAL: ${OP_ONTOLOGY_POLL_INTERVAL:-15}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    # Debug: uncomment to expose service directly (127.0.0.1 only — never 0.0.0.0)
    # ports:
    #   - "127.0.0.1:3003:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  pipeline-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: pipeline
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: pipeline-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    # Debug: uncomment to expose service directly (127.0.0.1 only — never 0.0.0.0)
    # ports:
    #   - "127.0.0.1:3004:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  # ─── Sandbox VM ──────────────────────────────────────────────────────────────
  # Runs isolated-vm (V8 Isolate) for JS/TS plugin code. Communicates with the
  # Execution Service exclusively via the sandbox-socket Unix socket volume.
  # Design spec §5.1, §7.6: no internal network access, read-only root fs,
  # non-root user (uid 1002), no Linux capabilities.
  op-sandbox-vm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    # Network isolation: sandbox can only reach the execution service via the
    # shared Unix socket (sandbox-socket volume). It has no TCP routes to any
    # internal service and no routes to the public network.
    networks:
      - oneplatform-sandbox
    volumes:
      # Shared Unix socket — execution-service dials /run/sandbox/op.sock
      - sandbox-socket:/run/sandbox
    restart: unless-stopped
    # No external secrets are injected — sandbox has no DB, Redis, or API access.
    environment:
      NODE_ENV: production
      # V8 hardening flags mirrored from Dockerfile.sandbox CMD. NODE_OPTIONS
      # ensures the flags apply even if the container is started with a custom
      # command (e.g., docker run overrides). Flags explained in Dockerfile.sandbox.
      NODE_OPTIONS: "--max-old-space-size=512 --disallow-code-generation-from-strings --jitless"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=50M
    healthcheck:
      # Verify the sandbox socket is listening before marking the service healthy.
      # The execution service depends_on this check before accepting traffic.
      test: ["CMD", "node", "-e", "require('net').createConnection('/run/sandbox/op.sock').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  execution-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: execution
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: execution-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost}
      OP_SANDBOX_POOL_SIZE: ${OP_SANDBOX_POOL_SIZE:-5}
      OP_CONNECTOR_TIMEOUT_SECONDS: ${OP_CONNECTOR_TIMEOUT_SECONDS:-300}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
      # Execution service connects to docker-socket-proxy for sandbox management
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    # x-service-common provides pgbouncer + redis deps, but YAML merge does not
    # deep-merge maps — overriding depends_on here replaces the whole map, so
    # pgbouncer, redis, docker-socket-proxy, and op-sandbox-vm must all be listed.
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      op-sandbox-vm:
        condition: service_healthy
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
      - sandbox-socket:/var/run/sandbox
    networks:
      - oneplatform-internal
      - oneplatform-sandbox
    # Debug: uncomment to expose service directly (127.0.0.1 only — never 0.0.0.0)
    # ports:
    #   - "127.0.0.1:3005:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"

  app-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: app
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: app-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost}
      OP_WILDCARD_DOMAIN: ${OP_WILDCARD_DOMAIN:-}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - app-data:/data/app
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    # Debug: uncomment to expose service directly (127.0.0.1 only — never 0.0.0.0)
    # ports:
    #   - "127.0.0.1:3006:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  logging-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: logging
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: logging-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    # Debug: uncomment to expose service directly (127.0.0.1 only — never 0.0.0.0)
    # ports:
    #   - "127.0.0.1:3007:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  plugin-service:
    <<: *service-common
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: plugin
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: plugin-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-oneplatform_minio_dev_2024}
      OP_SERVICE_TOKEN: ${OP_SERVICE_TOKEN:-}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - plugin-data:/data/plugin
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    # Debug: uncomment to expose service directly (127.0.0.1 only — never 0.0.0.0)
    # ports:
    #   - "127.0.0.1:3008:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ─── Observability: Jaeger ───────────────────────────────────────────────
  # All-in-one Jaeger image includes the collector, query UI, and agent.
  # COLLECTOR_OTLP_ENABLED=true exposes the OTLP/HTTP endpoint on port 4318,
  # which all services write spans to via OTEL_EXPORTER_OTLP_ENDPOINT.
  # The query UI on port 16686 is bound to 127.0.0.1 only — not exposed publicly.
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: op-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    networks:
      - oneplatform-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Observability: Grafana ──────────────────────────────────────────────
  # Grafana visualises Jaeger traces and exposes pre-built dashboards for
  # service health, ingestion metrics, and alerting rules via provisioning.
  # Port 3100 on the host maps to Grafana's internal 3000 — chosen to avoid
  # clashing with the application services, which all listen on :3000 inside
  # their containers.
  grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: op-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # DEV ONLY — the "admin" fallback password is intentional for local development.
      # In production (docker-compose.prod.yml) this variable is mandatory and
      # must be set to a strong random value (e.g. openssl rand -hex 32).
      GF_SECURITY_ADMIN_PASSWORD: ${OP_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Disable analytics and update checks — this stack is air-gapped by default.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - oneplatform-internal
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Log Aggregation: Vector ──────────────────────────────────────────────
  # File-based log collection — does NOT mount docker.sock (see ADR security model).
  # Vector tails Docker container JSON log files from the host path and writes
  # parsed, structured logs to the log-data named volume.
  vector:
    image: timberio/vector:0.39.0-alpine
    container_name: oneplatform-vector
    # Run as nobody (UID 65534) instead of root. The root group (GID 0) provides
    # read access to Docker container JSON log files on the host.
    # Vector has no network access to the Docker daemon and cannot create containers.
    user: "65534:0"
    volumes:
      # FTU-008: The host path /var/lib/docker/containers only exists on native
      # Linux Docker (including Linux VMs). On Docker Desktop for Mac, Windows,
      # or WSL2, the Docker daemon runs inside a Linux VM and its container log
      # files are not accessible at this path on the host.
      #
      # Fix options (choose one):
      #
      # 1. Set OP_DOCKER_DATA_ROOT in your .env file to the WSL2 internal path:
      #    OP_DOCKER_DATA_ROOT=/mnt/wsl/docker-desktop-data/data/docker/containers
      #    (path varies by Docker Desktop version — check your Docker Desktop settings)
      #
      # 2. On Docker Desktop for Mac (Apple Silicon / Intel), the VM filesystem is
      #    not directly accessible. Use a Docker Desktop extension or configure
      #    Vector to read from the Docker socket instead (requires CONTAINERS=1 on
      #    the docker-socket-proxy, which has security implications — see SA-010).
      #
      # 3. Accept that Vector log collection will not work on Docker Desktop and
      #    rely on `docker compose logs` for local development.
      #
      # See docs/TROUBLESHOOTING.md § "Vector container log collection" for details.
      - ${OP_DOCKER_DATA_ROOT:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - log-data:/var/log/oneplatform
    networks:
      - oneplatform-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ─── Layer 4: Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - oneplatform-internal
      - oneplatform-public
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Layer 5: TLS Reverse Proxy ──────────────────────────────────────────
  caddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.caddy
    container_name: caddy
    environment:
      OP_TLS_MODE:  ${OP_TLS_MODE:-internal}
      OP_DOMAIN:    ${OP_DOMAIN:-localhost}
      OP_TLS_EMAIL: ${OP_TLS_EMAIL:-}
    volumes:
      - caddy-data:/data/caddy
      - caddy-config:/config/caddy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - oneplatform-public
    depends_on:
      gateway-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    # Only /tmp is writable; the rendered Caddyfile lands there. Do NOT add an
    # /etc/caddy tmpfs — it would mask the Caddyfile sources baked into the image.
    tmpfs:
      - /tmp:size=50M
    healthcheck:
      # Caddy's admin API is disabled in the Caddyfile (admin off), so we probe
      # the actual HTTPS endpoint instead. --insecure / -k accepts the self-signed
      # certificate that Caddy generates for localhost (OP_TLS_MODE=internal).
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # ── Automated backup service ────────────────────────────────────────────────
  # Runs docker/scripts/backup.sh on a cron schedule (default: daily at 02:00 UTC).
  # Requires access to the Docker socket to exec into sibling containers and copy
  # files out. Uses docker-socket-proxy for limited Docker API access.
  #
  # Override OP_BACKUP_DIR to change the output directory (default: ./backups
  # relative to the repo root). Set OP_BACKUP_CRON to change the schedule.
  #
  # SECURITY: The backup directory contains all platform data including encrypted
  # secrets. Protect it: chmod 700 ./backups, and consider encrypting backups
  # at rest before transferring off-host.
  #
  # Disable by setting COMPOSE_PROFILES (or commenting out this service) when
  # running in environments where scheduled backups are handled externally.
  op-backup:
    image: docker:27-cli
    container_name: op-backup
    restart: unless-stopped
    environment:
      # Cron expression (5 fields). Default: daily at 02:00 UTC.
      OP_BACKUP_CRON: ${OP_BACKUP_CRON:-0 2 * * *}
      OP_BACKUP_DIR: ${OP_BACKUP_DIR:-/backups}
      OP_MINIO_USER: ${OP_MINIO_USER:-minioadmin}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-}
    volumes:
      # Docker socket — needed to exec into postgres/redis/minio containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Backup script
      - ./scripts/backup.sh:/usr/local/bin/op-backup.sh:ro
      # Output directory (host path) where timestamped backup archives are written
      - ${OP_BACKUP_DIR:-./backups}:/backups
    networks:
      - oneplatform-internal
    # The backup container installs crond at startup, writes a crontab entry
    # from OP_BACKUP_CRON, then runs crond in the foreground.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "$${OP_BACKUP_CRON} /usr/local/bin/op-backup.sh /backups >> /var/log/op-backup.log 2>&1" > /etc/crontabs/root
        echo "[op-backup] Backup scheduled: $${OP_BACKUP_CRON}"
        crond -f -L /var/log/op-backup.log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    profiles:
      - backup

volumes:
  # Data store persistence
  postgres-data:
  redis-data:
  minio-data:
  # Secret / key material produced by op-init
  init-data:
  shared-pubkeys:
  # Service-specific data mounts (only volumes actually mounted by a service)
  app-data:
  plugin-data:
  # IPC socket between execution-service and sandbox container
  sandbox-socket:
  # Aggregated structured logs written by Vector from all service containers
  log-data:
  # Grafana persistent state (user preferences, alert state, annotations)
  grafana-data:
  # TLS certificate storage and Caddy runtime config
  caddy-data:
  caddy-config:

networks:
  oneplatform-public:
    driver: bridge
  oneplatform-internal:
    driver: bridge
    # Security: internal=true prevents direct access from the host network.
    # Only the gateway and frontend are on both oneplatform-public and
    # oneplatform-internal networks. All service-to-service traffic stays on
    # this isolated bridge and is never reachable from the host.
    internal: true
  oneplatform-sandbox:
    driver: bridge
    internal: true
