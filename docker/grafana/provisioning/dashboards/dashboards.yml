apiVersion: 1

# Dashboard provisioning — Grafana scans the json/ subdirectory every 30 s
# and hot-reloads any changed or added dashboard JSON files.
# Dashboards loaded via provisioning are read-only in the UI (disableDeletion:
# true) to prevent accidental drift from the source-controlled definition.
providers:
  - name: OnePlatform
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
