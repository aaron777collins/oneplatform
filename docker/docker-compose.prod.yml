# docker/docker-compose.prod.yml
#
# Production override for the OnePlatform Docker Compose stack.
#
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# This file ONLY contains production overrides. It is intentionally minimal —
# it does not redefine services from scratch. Run it alongside docker-compose.yml.
#
# Required env vars: set these in your .env file before running.
#   OP_MINIO_PASSWORD   — MinIO admin password (openssl rand -hex 32)
#   POSTGRES_PASSWORD   — Postgres superuser password (openssl rand -hex 32)
#   OP_GRAFANA_PASSWORD — Grafana admin password (openssl rand -hex 32)
#   OP_ALLOWED_ORIGINS  — Comma-separated list of allowed CORS origins
#   OP_BASE_URL         — Public base URL (e.g. https://platform.example.com)
#   OP_DOMAIN           — Public domain name (e.g. platform.example.com)
#   OP_TLS_EMAIL        — Let's Encrypt account email
#
# The following secrets are set in docker-compose.yml with dev defaults and do
# NOT need to be overridden here (the base file handles them):
#   OP_JWT_SECRET       — JWT signing secret (set via base compose)
#   OP_MASTER_KEY       — Master encryption key (set via base compose)
#
# ── Scaling note ────────────────────────────────────────────────────────────
# This file does NOT set deploy.replicas. In standalone Docker Compose,
# the deploy: key is silently ignored. For horizontal scaling, use:
#   - Docker Swarm:     docker stack deploy -c docker-compose.yml \
#                                          -c docker-compose.prod.yml op
#   - Kubernetes:       convert with kompose and set replicaCount in Helm values
# The resource limits below (memory/cpu) ARE respected in standalone Compose.

services:

  # ── Postgres: require a strong superuser password ──────────────────────────
  postgres:
    environment:
      # :? syntax causes Docker Compose to fail with a clear error if unset.
      # The dev default (dev_postgres_superuser) is not safe for production.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Must set a strong POSTGRES_PASSWORD for production. Generate with: openssl rand -hex 32}"

  # ── Gateway: require production-critical env vars ─────────────────────────
  gateway-service:
    environment:
      NODE_ENV: production
      OP_ALLOWED_ORIGINS: "${OP_ALLOWED_ORIGINS:?Must set OP_ALLOWED_ORIGINS for production (comma-separated list of allowed origins)}"
      OP_BASE_URL: "${OP_BASE_URL:?Must set OP_BASE_URL for production (e.g. https://platform.example.com)}"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    deploy:
      resources:
        limits:
          # Gateway handles all inbound traffic — give it more headroom.
          memory: 1g
          cpus: "1"

  # ── Auth service ──────────────────────────────────────────────────────────
  auth-service:
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Ingestion service ──────────────────────────────────────────────────────
  ingestion-service:
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    deploy:
      resources:
        limits:
          # Ingestion handles large data volumes — raise memory ceiling.
          memory: 2g
          cpus: "2"

  # ── Ontology service ───────────────────────────────────────────────────────
  ontology-service:
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Pipeline service ───────────────────────────────────────────────────────
  pipeline-service:
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  # ── Sandbox VM ────────────────────────────────────────────────────────────────
  op-sandbox-vm:
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    deploy:
      resources:
        limits:
          # Isolate heap is bounded by NODE_OPTIONS --max-old-space-size=512.
          # Container memory limit is higher to cover Node.js runtime overhead,
          # native isolated-vm buffers, and OS page cache.
          memory: 768m
          cpus: "1"

  # ── Execution service ──────────────────────────────────────────────────────
  execution-service:
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"

  # ── App service ────────────────────────────────────────────────────────────
  app-service:
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  # ── Logging service ────────────────────────────────────────────────────────
  logging-service:
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Plugin service ─────────────────────────────────────────────────────────
  plugin-service:
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ── Grafana: require a strong admin password ──────────────────────────────
  grafana:
    environment:
      # :? syntax causes Docker Compose to fail with a clear error if unset.
      # The dev default ('admin') is not safe for production.
      GF_SECURITY_ADMIN_PASSWORD: "${OP_GRAFANA_PASSWORD:?Must set a strong OP_GRAFANA_PASSWORD for production. Generate with: openssl rand -hex 32}"

  # ── Caddy TLS: require production domain and email ────────────────────────
  caddy:
    environment:
      OP_TLS_MODE:  "auto"
      OP_DOMAIN:    "${OP_DOMAIN:?Must set OP_DOMAIN for production (e.g. platform.example.com)}"
      OP_TLS_EMAIL: "${OP_TLS_EMAIL:?Must set OP_TLS_EMAIL for production (Let's Encrypt account email)}"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
