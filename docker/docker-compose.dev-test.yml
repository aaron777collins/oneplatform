# OnePlatform — Isolated Dev-Test Docker Compose Stack
#
# This is a SELF-CONTAINED, fully isolated instance of the OnePlatform stack
# intended for users to try out the platform. It runs completely separately from
# the main docker-compose.yml (and any AI development work) by using:
#
#   - A dedicated network:       op-dev-test  (instead of oneplatform-*)
#   - A dedicated project name:  op-dev-test  (pass -p op-dev-test)
#   - 5xxx-range host ports:     no conflicts with the main stack
#   - op-dev-test- prefixed:     container names and named volumes
#   - A label on every service:  com.oneplatform.env=dev-test
#
# Start it with:
#   ./docker/dev-test-start.sh
#   # or manually:
#   docker compose -f docker/docker-compose.dev-test.yml -p op-dev-test up --build -d
#
# Host port map (dev-test → internal):
#   PostgreSQL    5532  → 5432
#   Redis         6479  → 6379
#   MinIO API     9100  → 9000
#   MinIO Console 9101  → 9001
#   Gateway       4080  → 3000   (direct, 127.0.0.1 only)
#   Caddy HTTP    8088  → 80    (redirects to HTTPS; 8088 avoids 8080 squatters)
#   Caddy HTTPS   8443  → 443   (primary entry point)
#   Jaeger UI    16687  → 16686  (127.0.0.1 only)
#   Grafana       3101  → 3000   (127.0.0.1 only)
#
# The internal architecture (secret injection via op-init, Ed25519 keys,
# PgBouncer pooling, sandbox isolation, container hardening) is identical to the
# main stack — only the external surface (ports, names, network) is remapped.

# Shared label applied to every container so the whole dev-test instance can be
# selected/cleaned up with: docker ps --filter label=com.oneplatform.env=dev-test
x-dev-test-labels: &dev-test-labels
  com.oneplatform.env: dev-test

# Shared OTEL environment variable injected into every service environment block.
# YAML merge (<<:) does not deep-merge maps, so this anchor is referenced
# explicitly in each service's environment block.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://op-dev-test-jaeger:4318}

x-service-common: &service-common
  # All application services share this base configuration.
  build:
    context: ..
    dockerfile: docker/Dockerfile.service
  restart: unless-stopped
  stop_grace_period: 45s
  labels:
    <<: *dev-test-labels
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"
  networks:
    - op-dev-test-internal
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
  # Container hardening — identical to the main stack: prevent privilege
  # escalation, drop all Linux capabilities, mount the root filesystem
  # read-only. Services write only to declared volumes and /tmp via tmpfs.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=100M

services:

  # ─── Layer 0: Init ────────────────────────────────────────────────────────
  # One-shot: generates all secrets and Ed25519 key pairs onto the init-data
  # volume. Identical to the main stack but writes to op-dev-test- volumes.
  op-init:
    image: alpine:3.19
    container_name: op-dev-test-init
    labels:
      <<: *dev-test-labels
    volumes:
      - init-data:/data/init
      - shared-pubkeys:/data/service-keys
      - ./init/init.sh:/init.sh:ro
    # alpine:3.19 ships without openssl, which init.sh needs for random secrets
    # and Ed25519 key generation. Install it before running the script. The
    # public bridge network is attached only to give apk outbound access to the
    # Alpine package mirror; op-init stays off the internal and sandbox networks.
    command: ["/bin/sh", "-c", "apk add --no-cache openssl && exec /bin/sh /init.sh"]
    networks:
      - op-dev-test-public
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-f", "/data/init/ready"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ─── Layer 1: Data Stores ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: op-dev-test-postgres
    command: ["postgres", "-c", "max_connections=200"]
    labels:
      <<: *dev-test-labels
    # op-init writes secret files as 0440 root:SECRET_GID (GID 1001). The postgres
    # entrypoint runs the initdb scripts (set-passwords.sh) as UID 70, which is
    # neither the owner nor in GID 1001, so it cannot read the per-service DB
    # password files. Adding GID 1001 as a supplementary group lets postgres read
    # them via the group bit — exactly the access the permission model intends —
    # without weakening the 0440 mode.
    group_add:
      - "1001"
    environment:
      POSTGRES_USER: postgres
      # Superuser password — only used during first-time PostgreSQL init on a
      # fresh volume. set-passwords.sh replaces it with the op-init generated
      # password immediately after init.sql runs.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_superuser}
      POSTGRES_DB: oneplatform
    ports:
      # Exposed on 127.0.0.1 only so users can connect with psql / a GUI client.
      - "127.0.0.1:5532:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - init-data:/data/init:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/set-passwords.sh:/docker-entrypoint-initdb.d/02-set-passwords.sh:ro
    networks:
      - op-dev-test-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oneplatform"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      op-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"

  redis:
    image: redis:7-alpine
    container_name: op-dev-test-redis
    labels:
      <<: *dev-test-labels
    # The custom entrypoint renders users.acl from the template using op-init passwords.
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    ports:
      # Exposed on 127.0.0.1 only for local inspection with redis-cli.
      - "127.0.0.1:6479:6379"
    volumes:
      - redis-data:/data
      - init-data:/data/init:ro
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - ./redis/users.acl.template:/etc/redis/users.acl.template:ro
      - ./redis/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    networks:
      - op-dev-test-internal
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          PASS=$(cat /data/init/redis_password_admin.txt | tr -d '[:space:]') &&
          redis-cli --user op_admin -a "$$PASS" ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      op-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: op-dev-test-minio
    labels:
      <<: *dev-test-labels
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      MINIO_ROOT_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
    ports:
      # 9100 = S3 API, 9101 = web console. 127.0.0.1 only.
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    volumes:
      - minio-data:/data
    networks:
      - op-dev-test-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    depends_on:
      op-init:
        condition: service_completed_successfully
    restart: unless-stopped

  docker-socket-proxy:
    # Interposes on the Docker API and allows only the verbs/resources the
    # execution service needs (CONTAINERS + IMAGES, GET/POST/DELETE). See the
    # extensive threat-model commentary in docker-compose.yml. Runs on the
    # isolated sandbox network only.
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: op-dev-test-docker-socket-proxy
    labels:
      <<: *dev-test-labels
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      LOG: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - op-dev-test-sandbox
    restart: unless-stopped
    depends_on:
      op-init:
        condition: service_completed_successfully

  # ─── Docker Fleet Manager sidecar ─────────────────────────────────────────
  # Bridges the App Service BFF Docker proxy to the Docker daemon. Talks to the
  # daemon through the read-only socket proxy (not a direct socket mount), and
  # is reachable by the App Service on the internal network. Authenticated via a
  # shared X-Service-Token (OP_SERVICE_TOKEN_SECRET) — must match app-service.
  docker-bff:
    container_name: op-dev-test-docker-bff
    build:
      context: ..
      dockerfile: services/docker-bff/Dockerfile
    labels:
      <<: *dev-test-labels
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      <<: *otel-env
      NODE_ENV: production
      PORT: "3000"
      DOCKER_HOST: tcp://op-dev-test-docker-socket-proxy:2375
      OP_SERVICE_TOKEN_SECRET: ${OP_SERVICE_TOKEN_SECRET:-dev_test_docker_bff_secret}
    networks:
      - op-dev-test-internal
      - op-dev-test-sandbox
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=50M
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # ─── Layer 2: Connection Pooler ───────────────────────────────────────────
  pgbouncer:
    # edoburu/pgbouncer is the maintained community image (the pgbouncer/pgbouncer
    # Docker Hub repo stops at 1.15.0). The custom entrypoint overrides the image
    # default, so only the pgbouncer + psql binaries it provides are required.
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: op-dev-test-pgbouncer
    labels:
      <<: *dev-test-labels
    # pgbouncer runs as UID 70 / GID 70 and reads op-init's 0440 root:1001 secret
    # files (and must traverse the 0750 root:1001 /data/init directory). Add GID
    # 1001 as a supplementary group so it can read them via the group bit.
    group_add:
      - "1001"
    entrypoint: ["/bin/sh", "/usr/local/bin/pgbouncer-entrypoint.sh"]
    volumes:
      - init-data:/data/init:ro
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt.template:/etc/pgbouncer/userlist.txt.template:ro
      - ./pgbouncer/pgbouncer-entrypoint.sh:/usr/local/bin/pgbouncer-entrypoint.sh:ro
    networks:
      - op-dev-test-internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          PASS=$(cat /data/init/db_password_app.txt 2>/dev/null | tr -d '[:space:]') &&
          PGPASSWORD="$$PASS" psql -h localhost -p 5433 -U app_service_role -d oneplatform_app -c 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ─── Layer 3: Application Services ───────────────────────────────────────
  # Service-to-service URLs use the op-dev-test- prefixed container names and
  # the shared internal port 3000. Each service mounts init-data read-only and
  # reads OP_* secrets via service-entrypoint.sh.

  gateway-service:
    <<: *service-common
    container_name: op-dev-test-gateway
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: gateway
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    # Gateway migrations declare FKs to auth.tenants, so auth-service must run its
    # migrations first. YAML merge replaces the whole depends_on map, so the
    # pgbouncer/redis conditions from *service-common are restated here.
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      <<: *otel-env
      SERVICE_NAME: gateway-service
      NODE_ENV: production
      PORT: "3000"
      # Service-to-service URLs — dev-test container names, internal port 3000.
      ONTOLOGY_SERVICE_URL: http://op-dev-test-ontology:3000
      INGESTION_SERVICE_URL: http://op-dev-test-ingestion:3000
      AUTH_SERVICE_URL: http://op-dev-test-auth:3000
      PIPELINE_SERVICE_URL: http://op-dev-test-pipeline:3000
      EXECUTION_SERVICE_URL: http://op-dev-test-execution:3000
      APP_SERVICE_URL: http://op-dev-test-app:3000
      LOGGING_SERVICE_URL: http://op-dev-test-logging:3000
      PLUGIN_SERVICE_URL: http://op-dev-test-plugin:3000
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost:8443}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost:8443}
      OP_GLOBAL_RATE_LIMIT: ${OP_GLOBAL_RATE_LIMIT:-10000}
      OP_MINIO_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
      OP_WEBHOOK_ALLOW_HTTP: ${OP_WEBHOOK_ALLOW_HTTP:-false}
    ports:
      # Direct gateway access for API testing / debugging. 127.0.0.1 only.
      - "127.0.0.1:4080:3000"
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    networks:
      - op-dev-test-internal
      - op-dev-test-public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  auth-service:
    <<: *service-common
    container_name: op-dev-test-auth
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: auth
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: auth-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost:8443}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost:8443}
      OP_REQUIRE_EMAIL_VERIFICATION: ${OP_REQUIRE_EMAIL_VERIFICATION:-false}
      OP_MINIO_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
      OP_SMTP_HOST: ${OP_SMTP_HOST:-}
      OP_SMTP_PORT: ${OP_SMTP_PORT:-}
      OP_SMTP_USER: ${OP_SMTP_USER:-}
      OP_SMTP_PASS: ${OP_SMTP_PASS:-}
      OP_SMTP_FROM: ${OP_SMTP_FROM:-}
      OP_SMTP_SECURE: ${OP_SMTP_SECURE:-true}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  ingestion-service:
    <<: *service-common
    container_name: op-dev-test-ingestion
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ingestion
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: ingestion-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost:8443}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost:8443}
      # Internal service-to-service URLs (all services listen on :3000).
      EXECUTION_SERVICE_URL: http://op-dev-test-execution:3000
      ONTOLOGY_SERVICE_URL: http://op-dev-test-ontology:3000
      OP_INGESTION_BATCH_SIZE: ${OP_INGESTION_BATCH_SIZE:-1000}
      OP_LARGE_SYNC_CONCURRENCY: ${OP_LARGE_SYNC_CONCURRENCY:-3}
      OP_MINIO_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  ontology-service:
    <<: *service-common
    container_name: op-dev-test-ontology
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ontology
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: ontology-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost:8443}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost:8443}
      # Internal service-to-service URLs (all services listen on :3000).
      EXECUTION_SERVICE_URL: http://op-dev-test-execution:3000
      OP_MIGRATION_TIMEOUT: ${OP_MIGRATION_TIMEOUT:-3600}
      OP_ONTOLOGY_POLL_INTERVAL: ${OP_ONTOLOGY_POLL_INTERVAL:-15}
      OP_MINIO_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  pipeline-service:
    <<: *service-common
    container_name: op-dev-test-pipeline
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: pipeline
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: pipeline-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost:8443}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost:8443}
      # Internal service-to-service URLs (all services listen on :3000).
      EXECUTION_SERVICE_URL: http://op-dev-test-execution:3000
      INGESTION_SERVICE_URL: http://op-dev-test-ingestion:3000
      ONTOLOGY_SERVICE_URL: http://op-dev-test-ontology:3000
      PLUGIN_SERVICE_URL: http://op-dev-test-plugin:3000
      OP_MINIO_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  # ─── Sandbox VM ──────────────────────────────────────────────────────────────
  # Runs isolated-vm for JS/TS plugin code. Communicates with the execution
  # service exclusively via the sandbox-socket Unix socket volume. No internal
  # network access, read-only root fs, no capabilities.
  op-sandbox-vm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    container_name: op-dev-test-sandbox-vm
    labels:
      <<: *dev-test-labels
    networks:
      - op-dev-test-sandbox
    volumes:
      - sandbox-socket:/run/sandbox
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=512 --disallow-code-generation-from-strings --jitless"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=50M
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection('/run/sandbox/op.sock').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  execution-service:
    <<: *service-common
    container_name: op-dev-test-execution
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: execution
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: execution-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost:8443}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost:8443}
      # Internal service-to-service URLs (all services listen on :3000).
      EXECUTION_SERVICE_URL: http://op-dev-test-execution:3000
      INGESTION_SERVICE_URL: http://op-dev-test-ingestion:3000
      PIPELINE_SERVICE_URL: http://op-dev-test-pipeline:3000
      PLUGIN_SERVICE_URL: http://op-dev-test-plugin:3000
      OP_SANDBOX_POOL_SIZE: ${OP_SANDBOX_POOL_SIZE:-5}
      OP_CONNECTOR_TIMEOUT_SECONDS: ${OP_CONNECTOR_TIMEOUT_SECONDS:-300}
      OP_MINIO_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
      DOCKER_HOST: tcp://op-dev-test-docker-socket-proxy:2375
    # YAML merge does not deep-merge maps — overriding depends_on replaces the
    # whole map, so all four dependencies must be listed explicitly.
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      op-sandbox-vm:
        condition: service_healthy
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
      - sandbox-socket:/var/run/sandbox
    networks:
      - op-dev-test-internal
      - op-dev-test-sandbox
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1"

  app-service:
    <<: *service-common
    container_name: op-dev-test-app
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: app
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: app-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost:8443}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost:8443}
      # Internal service-to-service URLs (all services listen on :3000).
      AUTH_SERVICE_URL: http://op-dev-test-auth:3000
      EXECUTION_SERVICE_URL: http://op-dev-test-execution:3000
      OP_WILDCARD_DOMAIN: ${OP_WILDCARD_DOMAIN:-}
      OP_MINIO_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
      # Docker Fleet Manager BFF proxy — opt-in. Routes /bff/docker/* to the
      # docker-bff sidecar after admin/devops RBAC. The shared secret must match
      # the sidecar's OP_SERVICE_TOKEN_SECRET.
      OP_ENABLE_DOCKER_BFF: ${OP_ENABLE_DOCKER_BFF:-true}
      OP_SERVICE_TOKEN_SECRET: ${OP_SERVICE_TOKEN_SECRET:-dev_test_docker_bff_secret}
      DOCKER_BFF_URL: http://docker-bff:3000
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - app-data:/data/app
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1"

  logging-service:
    <<: *service-common
    container_name: op-dev-test-logging
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: logging
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: logging-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost:8443}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost:8443}
      OP_MINIO_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  plugin-service:
    <<: *service-common
    container_name: op-dev-test-plugin
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: plugin
    entrypoint: ["/bin/sh", "/usr/local/bin/service-entrypoint.sh"]
    environment:
      <<: *otel-env
      SERVICE_NAME: plugin-service
      NODE_ENV: production
      PORT: "3000"
      OP_BASE_URL: ${OP_BASE_URL:-https://localhost:8443}
      OP_ALLOWED_ORIGINS: ${OP_ALLOWED_ORIGINS:-https://localhost:8443}
      # Internal service-to-service URLs (all services listen on :3000).
      EXECUTION_SERVICE_URL: http://op-dev-test-execution:3000
      INGESTION_SERVICE_URL: http://op-dev-test-ingestion:3000
      OP_MINIO_USER: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_MINIO_PASSWORD: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
      # Plugin bundle storage reads OP_S3_* (not OP_MINIO_*). Point it at the
      # dev-test MinIO container with the same root credentials; without these it
      # falls back to empty keys and the bundle-bucket create fails with HTTP 403.
      OP_S3_ENDPOINT: http://op-dev-test-minio:9000
      OP_S3_ACCESS_KEY: ${OP_MINIO_USER:-op_dev_test_minio}
      OP_S3_SECRET_KEY: ${OP_MINIO_PASSWORD:-op_dev_test_minio_pw_2026}
      OP_S3_REGION: us-east-1
    volumes:
      - init-data:/data/init:ro
      - shared-pubkeys:/data/service-keys:ro
      - plugin-data:/data/plugin
      - ./service-entrypoint.sh:/usr/local/bin/service-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ─── Observability: Jaeger ───────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: op-dev-test-jaeger
    labels:
      <<: *dev-test-labels
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16687:16686"
      - "127.0.0.1:4319:4318"
    networks:
      - op-dev-test-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Observability: Grafana ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: op-dev-test-grafana
    labels:
      <<: *dev-test-labels
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # DEV-TEST ONLY — "admin" fallback password is intentional for local trials.
      GF_SECURITY_ADMIN_PASSWORD: ${OP_GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3101:3000"
    networks:
      - op-dev-test-internal
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── Log Aggregation: Vector ──────────────────────────────────────────────
  # File-based log collection. On Docker Desktop (Mac/Windows/WSL2) the host
  # container-log path differs — set OP_DOCKER_DATA_ROOT if Vector can't read logs.
  vector:
    image: timberio/vector:0.39.0-alpine
    container_name: op-dev-test-vector
    labels:
      <<: *dev-test-labels
    user: "65534:0"
    volumes:
      - ${OP_DOCKER_DATA_ROOT:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - log-data:/var/log/oneplatform
    # Writable scratch for Vector's checkpoint/buffer data_dir. The log-data
    # volume root is root-owned and not writable by UID 65534, so use a tmpfs.
    tmpfs:
      - /vector-data:size=64M
    networks:
      - op-dev-test-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ─── Layer 4: Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: op-dev-test-frontend
    labels:
      <<: *dev-test-labels
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - op-dev-test-internal
      - op-dev-test-public
    restart: unless-stopped
    healthcheck:
      # Use 127.0.0.1, not localhost: nginx in this image listens on IPv4 only,
      # but localhost can resolve to ::1 first, giving a false "connection
      # refused". Pinning to the IPv4 loopback makes the check deterministic.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Layer 5: TLS Reverse Proxy ──────────────────────────────────────────
  # Uses OP_TLS_MODE=internal → Caddyfile.dev → self-signed cert for localhost.
  # Internally binds 80/443; mapped to host 8080/8443 to avoid clashing with the
  # main stack. Caddy reverse-proxies to the dev-test gateway/frontend by their
  # service names, which resolve on the op-dev-test-public network.
  caddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.caddy
    container_name: op-dev-test-caddy
    labels:
      <<: *dev-test-labels
    environment:
      OP_TLS_MODE:  ${OP_TLS_MODE:-internal}
      OP_DOMAIN:    ${OP_DOMAIN:-localhost}
      OP_TLS_EMAIL: ${OP_TLS_EMAIL:-}
    volumes:
      - caddy-data:/data/caddy
      - caddy-config:/config/caddy
    ports:
      # HTTP on 8088 (not 8080) to avoid colliding with other tools that
      # commonly squat 8080 (Jenkins, dozzle, etc.). HTTPS stays on 8443 and
      # is the primary entry point; HTTP only redirects to it.
      - "8088:80"
      - "8443:443"
    networks:
      - op-dev-test-public
    depends_on:
      gateway-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    # Only /tmp is writable; the rendered Caddyfile lands there. Do NOT add an
    # /etc/caddy tmpfs — it would mask the Caddyfile sources baked into the image.
    tmpfs:
      - /tmp:size=50M
    healthcheck:
      # Use localhost (not 127.0.0.1): Caddy's internal CA issues the cert for
      # the SNI name "localhost", so probing by IP triggers a TLS alert. Caddy
      # binds both IPv4 and IPv6, so localhost resolution is not a problem here.
      # busybox wget cannot validate Caddy's internally-issued (local CA) cert and
      # errors on the HTTP→HTTPS redirect, so probe the listening TLS port with nc
      # instead. A successful TCP connect to :443 confirms Caddy is up and serving.
      test: ["CMD-SHELL", "nc -z localhost 443 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

volumes:
  # Data store persistence (op-dev-test- prefixed names)
  postgres-data:
    name: op-dev-test-postgres-data
  redis-data:
    name: op-dev-test-redis-data
  minio-data:
    name: op-dev-test-minio-data
  # Secret / key material produced by op-init
  init-data:
    name: op-dev-test-init-data
  shared-pubkeys:
    name: op-dev-test-shared-pubkeys
  # Service-specific data mounts
  app-data:
    name: op-dev-test-app-data
  plugin-data:
    name: op-dev-test-plugin-data
  # IPC socket between execution-service and sandbox container
  sandbox-socket:
    name: op-dev-test-sandbox-socket
  # Aggregated structured logs written by Vector
  log-data:
    name: op-dev-test-log-data
  # Grafana persistent state
  grafana-data:
    name: op-dev-test-grafana-data
  # TLS certificate storage and Caddy runtime config
  caddy-data:
    name: op-dev-test-caddy-data
  caddy-config:
    name: op-dev-test-caddy-config

networks:
  op-dev-test-public:
    name: op-dev-test-public
    driver: bridge
  op-dev-test-internal:
    name: op-dev-test-internal
    driver: bridge
    # internal=true prevents direct access from the host network. Only gateway
    # and frontend straddle public + internal; all service-to-service traffic
    # stays on this isolated bridge.
    internal: true
  op-dev-test-sandbox:
    name: op-dev-test-sandbox
    driver: bridge
    internal: true
