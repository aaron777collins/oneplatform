; PgBouncer configuration for OnePlatform
; Ref: L1 Design Spec §3, ADR-5
;
; Dual-mode pooling:
;   - Transaction mode (6 services): connections returned after each transaction
;   - Session mode (3 services): Ontology + Pipeline + Logging need advisory
;     locks / LISTEN. Logging takes a session-scoped pg_advisory_lock (with a
;     parameterized bind) during migration, which transaction pooling breaks
;     with "prepared statement requires 0 parameters".

[databases]
oneplatform_gateway   = host=postgres port=5432 dbname=oneplatform user=gateway_service_role   pool_size=15 pool_mode=transaction
oneplatform_auth      = host=postgres port=5432 dbname=oneplatform user=auth_service_role      pool_size=20 pool_mode=transaction
oneplatform_ingestion = host=postgres port=5432 dbname=oneplatform user=ingestion_service_role pool_size=25 pool_mode=transaction
oneplatform_app       = host=postgres port=5432 dbname=oneplatform user=app_service_role       pool_size=15 pool_mode=transaction
oneplatform_logging   = host=postgres port=5432 dbname=oneplatform user=logging_service_role   pool_size=30 pool_mode=session
oneplatform_plugin    = host=postgres port=5432 dbname=oneplatform user=plugin_service_role    pool_size=10 pool_mode=transaction
oneplatform_execution = host=postgres port=5432 dbname=oneplatform user=execution_service_role pool_size=10 pool_mode=transaction
oneplatform_ontology  = host=postgres port=5432 dbname=oneplatform user=ontology_service_role  pool_size=15 pool_mode=session
oneplatform_pipeline  = host=postgres port=5432 dbname=oneplatform user=pipeline_service_role  pool_size=25 pool_mode=session

[pgbouncer]
listen_port = 5433
listen_addr = 0.0.0.0
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
max_client_conn = 200
; The pg driver sends statement_timeout (and extra_float_digits) as connection
; startup parameters. In transaction pooling mode PgBouncer rejects unknown
; startup parameters with "unsupported startup parameter" unless they are listed
; here, so allow these well-known ones to be forwarded to the server.
ignore_startup_parameters = statement_timeout,extra_float_digits
default_pool_size = 20
server_idle_timeout = 60
client_idle_timeout = 600
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
