name: Release

on:
  push:
    tags:
      - "v*"

# A release tag fires once; no concurrency group needed.
permissions:
  contents: write  # required by gh-release to create a GitHub Release
  packages: write  # required to push to ghcr.io

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/oneplatform

jobs:
  # ── 1. Validate & test ────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm lint && pnpm format:check

      - name: Run tests
        run: pnpm test

  # ── 2. Build packages ─────────────────────────────────────────────────────
  build:
    name: Build Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  # ── 3. GitHub Release ─────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract
        # Strip the leading 'v' so we can match it in the changelog
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog body for this release
        id: changelog
        # Awk pulls the block between the [version] header and the next [x.y.z] header.
        # Falls back to a generic message if the version isn't found.
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          BODY=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release $GITHUB_REF_NAME"
          fi
          # Persist across steps via a temp file (avoids GITHUB_OUTPUT multiline quoting issues)
          echo "$BODY" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OnePlatform ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Docker images ──────────────────────────────────────────────────────
  docker-services:
    name: Docker — ${{ matrix.service }}
    needs: github-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - auth
          - ingestion
          - ontology
          - pipeline
          - execution
          - app
          - logging
          - plugin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.service
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          # Tag with both the exact version and 'latest' so operators can pin or float
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}-service:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-frontend:
    name: Docker — frontend
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
