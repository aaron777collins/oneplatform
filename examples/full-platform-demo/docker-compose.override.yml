# =============================================================================
# Full Platform Demo — Docker Compose Override
#
# Extends the main docker/docker-compose.yml with demo-specific additions:
#   - Seed data service (one-shot container that runs the seed script)
#   - Mock external API server (WireMock) for connector testing
#   - Grafana dashboard provisioning with demo-specific dashboards
#   - Sample data volumes for persistent demo state
#
# Usage:
#   docker compose -f ../../docker/docker-compose.yml -f docker-compose.override.yml up -d
#   # or via npm:
#   npm run demo:up
#
# This file uses Docker Compose "override" semantics: services with the same
# name as the main file are merged (not replaced). New services are added.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Demo Seed Service — one-shot container
  #
  # Runs the TypeScript seed script after all platform services are healthy.
  # Exits with code 0 on success. Re-run with:
  #   docker compose -f ... run --rm demo-seed
  # ---------------------------------------------------------------------------
  demo-seed:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
    working_dir: /app/examples/full-platform-demo
    entrypoint: ["node", "--import", "tsx", "scripts/seed.ts"]
    environment:
      OP_BASE_URL: ${OP_BASE_URL:-https://gateway-service:3000}
      OP_API_KEY: ${OP_API_KEY:-op_live_REPLACE_ME}
      DEMO_SKIP_CONNECTORS: ${DEMO_SKIP_CONNECTORS:-false}
      DEMO_TRIGGER_PIPELINES: ${DEMO_TRIGGER_PIPELINES:-true}
      # Trust the internal Caddy self-signed cert when the seed script connects
      # to the gateway via HTTPS inside the Docker network.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    volumes:
      # Mount seed data and scripts as read-only so the container picks up
      # the latest version without rebuilding.
      - ./seed:/app/examples/full-platform-demo/seed:ro
      - ./scripts:/app/examples/full-platform-demo/scripts:ro
      - demo-seed-state:/app/examples/full-platform-demo/.state
    networks:
      - oneplatform-internal
    depends_on:
      gateway-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      ontology-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      pipeline-service:
        condition: service_healthy
      app-service:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ---------------------------------------------------------------------------
  # Mock External API — WireMock
  #
  # Provides stubbed responses for the demo connectors so you can test the full
  # pipeline flow without real external API credentials. The mappings simulate:
  #   - Salesforce Account query endpoint
  #   - Product catalog REST API
  #   - Shopify orders endpoint
  #
  # Access the WireMock admin UI at http://localhost:9090/__admin
  # ---------------------------------------------------------------------------
  mock-api:
    image: wiremock/wiremock:3.5.4
    container_name: op-demo-mock-api
    command: ["--port", "8080", "--verbose"]
    volumes:
      - demo-mock-mappings:/home/wiremock/mappings
    ports:
      - "127.0.0.1:9090:8080"
    networks:
      - oneplatform-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ---------------------------------------------------------------------------
  # Grafana — override to add demo dashboard provisioning
  #
  # Merges with the Grafana service from the main docker-compose.yml.
  # The demo dashboard JSON is mounted alongside the platform dashboards.
  # ---------------------------------------------------------------------------
  grafana:
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/json/demo-overview.json:ro

# ---------------------------------------------------------------------------
# Volumes — demo-specific persistent state
# ---------------------------------------------------------------------------
volumes:
  # Tracks whether the seed script has already run (prevents duplicate seeding
  # when the stack is restarted).
  demo-seed-state:

  # WireMock mapping files for mock external API responses.
  demo-mock-mappings:

  # Re-declare volumes from the main compose file that are referenced above.
  # Docker Compose requires volume declarations in the file that uses them.
  grafana-data:

# ---------------------------------------------------------------------------
# Networks — re-declare the internal network from the main compose file.
# ---------------------------------------------------------------------------
networks:
  oneplatform-internal:
    external: false
