# ---------------------------------------------------------------------------
# docker-compose.override.yml — Demo-specific overrides
#
# This file extends the base docker-compose.yml in the project root. It adds
# monitoring services (Grafana, Jaeger), exposes additional ports for debugging,
# and configures demo-friendly defaults.
#
# Usage:
#   docker compose -f ../../docker/docker-compose.yml -f docker-compose.override.yml up -d
#
# Or via the npm script:
#   npm run demo:up
# ---------------------------------------------------------------------------

services:
  # ── Gateway overrides ───────────────────────────────────────────────────
  gateway:
    environment:
      - LOG_LEVEL=debug
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3100,http://localhost:16686
      - RATE_LIMIT_ENABLED=false
    ports:
      - "8080:8080"

  # ── Auth Service overrides ──────────────────────────────────────────────
  auth:
    environment:
      - LOG_LEVEL=debug
      - TOKEN_EXPIRY_SECONDS=3600
      - REFRESH_TOKEN_EXPIRY_SECONDS=86400
      - PASSWORD_MIN_LENGTH=8

  # ── Ingestion Service overrides ─────────────────────────────────────────
  ingestion:
    environment:
      - LOG_LEVEL=debug
      - MAX_BATCH_SIZE=1000
      - DEDUP_WINDOW_SECONDS=300

  # ── Pipeline Service overrides ──────────────────────────────────────────
  pipeline:
    environment:
      - LOG_LEVEL=debug
      - MAX_CONCURRENT_RUNS=10
      - STEP_TIMEOUT_SECONDS=300

  # ── Execution Service overrides ─────────────────────────────────────────
  execution:
    environment:
      - LOG_LEVEL=debug
      - SANDBOX_MEMORY_LIMIT_MB=512
      - SANDBOX_TIMEOUT_SECONDS=60
      - SANDBOX_POOL_SIZE=5

  # ── App Service overrides ──────────────────────────────────────────────
  app:
    environment:
      - LOG_LEVEL=debug
      - HOT_RELOAD=true

  # ── Grafana ─────────────────────────────────────────────────────────────
  # Pre-configured monitoring dashboard for platform observability.
  # Access at http://localhost:3100
  grafana:
    image: grafana/grafana:11.1.0
    container_name: oneplatform-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${OP_GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/oneplatform.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/oneplatform.json:ro
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus

  # ── Prometheus ──────────────────────────────────────────────────────────
  # Metrics collection for Grafana dashboards.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: oneplatform-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus-data:/prometheus

  # ── Jaeger ──────────────────────────────────────────────────────────────
  # Distributed tracing UI for debugging request flows across services.
  # Access at http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: oneplatform-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger

volumes:
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  jaeger-data:
    driver: local
